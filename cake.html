<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Beba ❤️</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0f172a;color:white;font-family:Arial;overflow:hidden}
.container{text-align:center}
h1{margin-bottom:60px}

.cake{position:relative;width:220px;display:flex;margin:auto;cursor:pointer}
.half{width:50%;transition:.6s;position:relative}
.left.cut{transform:translateX(-40px) rotate(-10deg)}
.right.cut{transform:translateX(40px) rotate(10deg)}

.layer{height:40px;margin:5px;border-radius:10px}
.layer1{background:#ffb3c6}
.layer2{background:#ff4d6d}
.layer3{background:#c9184a}

/* Candles attached to halves */
.candles{position:absolute;top:-40px;width:100%;display:flex;justify-content:space-around;pointer-events:none}
.half .candles{position:relative;top:-40px}

.candle{width:6px;height:25px;background:white;position:relative}

/* wick */
.candle::after{
  content:"";
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  width:2px;height:4px;background:#222;border-radius:1px;
}

/* wick glow */
.candle.glow::after{
  box-shadow:0 0 6px 2px orange;
}

.flame{
  width:6px;height:10px;background:orange;border-radius:50%;position:absolute;top:-10px;
  animation:flicker .2s infinite;
  opacity:1;transition:opacity .6s ease, transform .6s ease;
}

/* bend effect */
.flame.bend{
  transform: rotate(-20deg) scale(1.6);
}

.flame.fade-out{opacity:0;transform:scale(0.2)}

@keyframes flicker{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

/* smoke */
.smoke{
  position:absolute;width:6px;height:6px;background:rgba(200,200,200,0.6);
  border-radius:50%;top:-12px;left:0;animation:smokeRise 1.5s forwards;
}
@keyframes smokeRise{
  0%{opacity:0.8;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-30px) scale(1.8)}
}

.knife-cursor,.knife-cursor *{cursor:url('knife.png') 16 16, pointer !important}

#love{opacity:0;margin-top:20px;font-size:22px;transition:2s;text-shadow:0 0 10px pink,0 0 20px pink}
.show{opacity:1}

canvas{position:fixed;top:0;left:0;pointer-events:none}
</style>
</head>
<body>
<div class="container">
<h1>Happy Birthday Beba ❤️</h1>

<div class="cake" id="cake" onclick="cutCake()">
  <div class="half left" id="left">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="layer layer3"></div>
    <div class="layer layer2"></div>
    <div class="layer layer1"></div>
  </div>

  <div class="half right" id="right">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="layer layer3"></div>
    <div class="layer layer2"></div>
    <div class="layer layer1"></div>
  </div>
</div>

<div id="msg">Allow mic & blow 💨</div>
<div id="love">I love you Beba ❤️</div>
</div>

<canvas id="confetti"></canvas>
<canvas id="fire"></canvas>

<script>
let analyser,dataArray,listening=false,first=false,ready=false;

function wind(){
  let ctx=new (window.AudioContext||window.webkitAudioContext)();
  let buffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  let data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  let src=ctx.createBufferSource();src.buffer=buffer;
  let gain=ctx.createGain();
  gain.gain.setValueAtTime(0.4,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+1);
  src.connect(gain);gain.connect(ctx.destination);
  src.start();
}

async function init(){
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
const ctx=new AudioContext();
const src=ctx.createMediaStreamSource(stream);
analyser=ctx.createAnalyser();analyser.fftSize=256;
src.connect(analyser);
dataArray=new Uint8Array(analyser.frequencyBinCount);
listening=true;loop();
}catch{document.getElementById('msg').innerText="Allow mic"}
}

function createSmoke(candle){
  for(let i=0;i<3;i++){
    let s=document.createElement('div');
    s.className='smoke';
    s.style.left='2px';
    candle.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

function loop(){
if(!listening)return;
analyser.getByteFrequencyData(dataArray);
let v=dataArray.reduce((a,b)=>a+b)/dataArray.length;
let flames=document.querySelectorAll('.flame');
let candles=document.querySelectorAll('.candle');

if(!first && v>45){
first=true;
wind();
flames.forEach(f=>f.classList.add('bend'));
document.getElementById('msg').innerText="ZOOR LAGAO 💨";
setTimeout(loop,700);return;
}

if(first && v>60){
listening=false;
wind();
flames.forEach((f,i)=>{
  f.classList.add('fade-out');
  candles[i].classList.add('glow');
  createSmoke(candles[i]);
});
setTimeout(()=>{
  flames.forEach(f=>f.style.display='none');
  candles.forEach(c=>c.classList.remove('glow'));
},800);

document.body.classList.add('knife-cursor');
ready=true;
document.getElementById('msg').innerText="Cut cake 🎂";
return;
}
requestAnimationFrame(loop);
}

function cutCake(){
if(!ready)return;
document.getElementById('left').classList.add('cut');
document.getElementById('right').classList.add('cut');

let u=new SpeechSynthesisUtterance("Happy Birthday");
u.pitch=1.4;u.rate=0.9;
speechSynthesis.speak(u);

document.getElementById('love').classList.add('show');
startConfetti();
launchFireworks();
}

// confetti
let c=document.getElementById('confetti');
let ctx=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let pieces=[];

function burst(){
for(let i=0;i<50;i++){
pieces.push({x:Math.random()<.5?0:c.width,y:c.height/2,dx:(Math.random()*6+2)*(Math.random()<.5?1:-1),dy:Math.random()*-6,r:Math.random()*5+2,color:`hsl(${Math.random()*360},100%,50%)`});
}}

function draw(){
ctx.clearRect(0,0,c.width,c.height);
pieces.forEach(p=>{
ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
p.x+=p.dx;p.y+=p.dy;p.dy+=0.2;
});
}

function startConfetti(){
setInterval(burst,700);
setInterval(draw,20);
}

// fireworks (3 times from bottom)
let fw=document.getElementById('fire');
let fctx=fw.getContext('2d');
fw.width=innerWidth;fw.height=innerHeight;

function explode(){
let sparks=[];
for(let i=0;i<80;i++){
sparks.push({x:fw.width/2,y:fw.height,angle:Math.random()*Math.PI- Math.PI/2,speed:Math.random()*6+2});
}
let t=0;
let int=setInterval(()=>{
fctx.clearRect(0,0,fw.width,fw.height);
sparks.forEach(s=>{
fctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
fctx.fillRect(s.x,s.y,3,3);
s.x+=Math.cos(s.angle)*s.speed;
s.y+=Math.sin(s.angle)*s.speed;
});
t++; if(t>25) clearInterval(int);
},20);
}

function launchFireworks(){
explode();setTimeout(explode,800);setTimeout(explode,1600);
}

init();
</script>
</body>
</html>
